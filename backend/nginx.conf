# Nginx Load Balancer Configuration for Hotel Management System
# Supports 10,000+ concurrent users

# Upstream backend servers - Add more servers as needed
upstream hotel_backend {
    # Load balancing method: least_conn = send to server with least active connections
    least_conn;
    
    # Add your backend servers here
    # For single server with PM2 clustering:
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    
    # For multiple servers (horizontal scaling):
    # server 192.168.1.101:5000 max_fails=3 fail_timeout=30s weight=1;
    # server 192.168.1.102:5000 max_fails=3 fail_timeout=30s weight=1;
    # server 192.168.1.103:5000 max_fails=3 fail_timeout=30s weight=2; # More powerful server
    
    # Health check
    keepalive 100; # Keep 100 connections open for reuse
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=booking:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Cache settings
proxy_cache_path /var/cache/nginx/hotel levels=1:2 keys_zone=hotel_cache:100m max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # Change this
    
    # Redirect to HTTPS (uncomment when SSL is configured)
    # return 301 https://$server_name$request_uri;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # File upload size
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Connection limits (10 connections per IP)
    limit_conn addr 10;
    
    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    
    # Static files (uploads) - cache aggressively
    location /uploads/ {
        alias /path/to/hotel/backend/uploads/; # Change this path
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # API Routes - High traffic endpoints
    
    # Restaurant Menu - Cache heavily (changes infrequently)
    location /api/restaurant/menu {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://hotel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Cache at Nginx level
        proxy_cache hotel_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # Banquet listings - Cache for 10 minutes
    location /api/banquets {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://hotel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Cache
        proxy_cache hotel_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # Restaurant & Banquet Bookings - Strict rate limiting
    location ~ ^/api/(restaurant/bookings|bookings) {
        limit_req zone=booking burst=5 nodelay;
        
        proxy_pass http://hotel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # No caching for bookings (real-time data)
    }
    
    # Authentication endpoints - Very strict rate limiting
    location /api/auth/ {
        limit_req zone=auth burst=3 nodelay;
        
        proxy_pass http://hotel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    
    # General API routes
    location /api/ {
        limit_req zone=general burst=50 nodelay;
        
        proxy_pass http://hotel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Buffer settings for high traffic
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # Health check endpoint
    location /api/health {
        access_log off;
        proxy_pass http://hotel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # Root - serve frontend
    location / {
        root /path/to/hotel/frontend/build; # Change this path
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }
}

